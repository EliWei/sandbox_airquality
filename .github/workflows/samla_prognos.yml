# Samla väderprognos

# Varje hel timme skickar cron-job.org en signal till GitHub som startar
# det här flödet (workflow_dispatch). GitHub startar då en tillfällig dator,
# hämtar repot, installerar Python och paketen, kör skriptet, och committar
# den nya prognosfilen tillbaka till repot.
#
# GitHubs eget schema (schedule) användes först, men körningarna
# försenades och hoppades ofta över, därför används en extern trigger.
# Åtkomstnyckeln som cron-job.org använder går ut 2026-12-02.
# Flödet kan också startas manuellt under fliken Actions.

name: Samla väderprognos

on:
  workflow_dispatch:        # gör att flödet också kan startas manuellt

permissions:
  contents: write           # tillåter flödet att committa den nya datan

jobs:
  samla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera paket
        run: pip install requests pandas

      - name: Hämta prognos
        run: python prognosinsamling/samla_prognos.py

      - name: Committa ny data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prognosinsamling/prognoser
          git diff --staged --quiet || git commit -m "Prognos $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push